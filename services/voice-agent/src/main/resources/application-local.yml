spring:
  datasource:
    url: ${VOICE_DB_URL:jdbc:postgresql://localhost:15432/jc_voice_shopping}
    username: ${VOICE_DB_USERNAME:voice_shopping}
    password: ${VOICE_DB_PASSWORD:voice_shopping_local}
  data:
    redis:
      host: ${VOICE_REDIS_HOST:localhost}
      port: ${VOICE_REDIS_PORT:6380}
      password: ${VOICE_REDIS_PASSWORD:}
      database: ${VOICE_REDIS_DATABASE:0}

agentscope:
  dashscope:
    # 请通过 DASHSCOPE_API_KEY 环境变量提供自己的密钥。
    api-key: ${DASHSCOPE_API_KEY:local-placeholder}

voice-shopping:
  voice:
    # 没有个人 DashScope Key 时，禁止启动阶段调用远程 TTS。
    cache-preload-enabled: false

server:
  port: ${VOICE_SERVER_PORT:8080}
