server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index local-demo.html mall.html;

    location / {
        try_files $uri $uri/ /local-demo.html;
    }

    location /mall-api/ {
        proxy_pass http://mall-service:8070/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /group-api/ {
        proxy_pass http://group-buy-service:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /agent-api/ {
        proxy_pass http://voice-agent:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

