<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>进入本地融合商城</title>
</head>
<body>
<p>正在进入本地商城…</p>
<script>
    // 仅用于本机联调，跳过微信登录并使用固定的演示用户。
    document.cookie = 'loginToken=local-demo-user; path=/; SameSite=Lax';
    const params = new URLSearchParams(window.location.search);
    const requested = params.get('next') || 'mall.html';
    const allowedPages = new Set(['mall.html', 'index.html', 'order-list.html']);
    let target = 'mall.html';
    try {
        const url = new URL(requested, window.location.href);
        const page = url.pathname.split('/').pop();
        if (url.origin === window.location.origin && allowedPages.has(page)) {
            target = page + url.search + url.hash;
        }
    } catch (error) {
        console.warn('忽略无效的本地演示跳转地址', error);
    }
    window.location.replace(target);
</script>
</body>
</html>
