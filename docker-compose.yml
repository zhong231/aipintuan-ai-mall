name: aipintuan

services:
  mysql:
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: ${AIPINTUAN_MYSQL_ROOT_PASSWORD:-aipintuan_local}
      TZ: Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/01-mall.sql:/docker-entrypoint-initdb.d/01-mall.sql:ro
      - ./database/02-group-buy.sql:/docker-entrypoint-initdb.d/02-group-buy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${AIPINTUAN_RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${AIPINTUAN_RABBITMQ_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aipintuan_voice_agent
      POSTGRES_USER: aipintuan_voice_agent
      POSTGRES_PASSWORD: ${AIPINTUAN_VOICE_DB_PASSWORD:-aipintuan_voice_agent_local}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/aipintuan-voice-agent/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./services/aipintuan-voice-agent/src/main/resources/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipintuan_voice_agent -d aipintuan_voice_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  aipintuan-group-buy:
    image: aipintuan/group-buy:local
    build: ./services/aipintuan-group-buy
    environment:
      AIPINTUAN_MYSQL_ROOT_PASSWORD: ${AIPINTUAN_MYSQL_ROOT_PASSWORD:-aipintuan_local}
      AIPINTUAN_RABBITMQ_USERNAME: ${AIPINTUAN_RABBITMQ_USERNAME:-admin}
      AIPINTUAN_RABBITMQ_PASSWORD: ${AIPINTUAN_RABBITMQ_PASSWORD:-admin}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  aipintuan-mall:
    image: aipintuan/mall:local
    build: ./services/aipintuan-mall
    environment:
      AIPINTUAN_MYSQL_ROOT_PASSWORD: ${AIPINTUAN_MYSQL_ROOT_PASSWORD:-aipintuan_local}
      AIPINTUAN_RABBITMQ_USERNAME: ${AIPINTUAN_RABBITMQ_USERNAME:-admin}
      AIPINTUAN_RABBITMQ_PASSWORD: ${AIPINTUAN_RABBITMQ_PASSWORD:-admin}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aipintuan-group-buy:
        condition: service_started
    restart: unless-stopped

  aipintuan-voice-agent:
    image: aipintuan/voice-agent:local
    build:
      context: ./services/aipintuan-voice-agent
      dockerfile: Dockerfile.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      AIPINTUAN_VOICE_DB_URL: jdbc:postgresql://postgres:5432/aipintuan_voice_agent
      AIPINTUAN_VOICE_DB_USERNAME: aipintuan_voice_agent
      AIPINTUAN_VOICE_DB_PASSWORD: ${AIPINTUAN_VOICE_DB_PASSWORD:-aipintuan_voice_agent_local}
      AIPINTUAN_VOICE_REDIS_HOST: redis
      AIPINTUAN_VOICE_REDIS_PORT: 6379
      AIPINTUAN_VOICE_REDIS_DATABASE: 1
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-local-placeholder}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  aipintuan-web:
    image: aipintuan/web:local
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8088:80"
    depends_on:
      aipintuan-mall:
        condition: service_started
      aipintuan-group-buy:
        condition: service_started
      aipintuan-voice-agent:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  postgres-data:
